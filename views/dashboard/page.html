<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- As the markdown file page's: the jj log and the file's preview are
         set as HTML, and a markdown file can hold any. Frames are the html
         app's pages, on the server's port + 1. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src *; connect-src 'self' ws://localhost:* ws://127.0.0.1:*; frame-src http://127.0.0.1:*; object-src 'none'"
    />
    <title>Workspace</title>
    <!-- The terminal theme's vars (views/theme.ts) and the box-drawing rules -->
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/github-markdown.css" />
    <link rel="stylesheet" href="../markdown/markdown.css" />
    <link rel="stylesheet" href="../markdown/xterm.css" />
    <style>
      /* Light or dark with the OS, in Rex's themes (/theme.css) */
      :root {
        color-scheme: light dark;
        --bg: var(--term-bg);
        --text: var(--term-fg);
        --muted: color-mix(in srgb, var(--term-fg) 65%, var(--term-bg));
        --surface: color-mix(in srgb, var(--term-fg) 4%, var(--term-bg));
        --border: color-mix(in srgb, var(--term-fg) 14%, var(--term-bg));
        --accent: var(--ansi-12);
        --accent-bg: color-mix(in srgb, var(--ansi-12) 16%, var(--term-bg));
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font: calc(var(--term-size) + 2px)/1.4 var(--term-font);
      }
      #top {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      #strip {
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        padding: 2px 9px;
        font-size: 1.1em;
        border-radius: 5px;
        border: 1px solid var(--border);
        color: var(--muted);
        cursor: pointer;
        transition:
          background-color 150ms,
          color 150ms,
          border-color 150ms;
      }
      .chip.focused {
        color: var(--accent);
        font-weight: bold;
        background: var(--accent-bg);
        border-color: transparent;
      }
      main {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      /* The log, and under it nvim on a file clicked in it (client.ts) */
      #left {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      #log-pane {
        flex: 1 1 0;
        min-height: 0;
        overflow: auto;
        padding: 16px 20px 20px;
      }
      /* jj and Tests over the log pane, flat like the tracker tabs */
      #log-tabs {
        display: flex;
        flex: none;
        border-bottom: 1px solid var(--border);
      }
      .log-tab {
        padding: 6px 14px;
        font-size: 0.9em;
        color: var(--muted);
        cursor: pointer;
        border-right: 1px solid var(--border);
      }
      .log-tab:hover {
        color: inherit;
      }
      .log-tab.current {
        color: var(--accent);
        background: var(--accent-bg);
      }
      /* Whole-repo jj operations, over the jj tab only (client.ts) */
      #log-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 8px;
      }
      #log-actions[hidden] {
        display: none;
      }
      #log-actions button {
        padding: 1px 9px;
        font: inherit;
        font-size: 0.85em;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      #log-actions button:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      #tests-pane {
        flex: 1 1 0;
        min-height: 0;
        overflow: auto;
        padding: 10px 20px 20px;
      }
      #prs-pane,
      #issues-pane {
        flex: 1 1 0;
        min-height: 0;
        overflow: auto;
        padding: 10px 20px 20px;
      }
      #tests-pane[hidden],
      #prs-pane[hidden],
      #issues-pane[hidden],
      #log-pane[hidden] {
        display: none;
      }
      .pr {
        padding: 8px 0;
        border-bottom: 1px solid var(--border);
      }
      .pr-head {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .pr-title {
        color: inherit;
        text-decoration: none;
      }
      .pr-title:hover {
        text-decoration: underline;
      }
      .pr-state {
        flex: none;
        padding: 0 6px;
        border-radius: 4px;
        font-size: 0.85em;
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .pr-state.open {
        color: var(--ansi-2);
        border-color: var(--ansi-2);
      }
      .pr-state.merged {
        color: var(--ansi-5);
        border-color: var(--ansi-5);
      }
      .pr-meta {
        color: var(--muted);
        font-size: 0.9em;
        margin: 2px 0 4px;
      }
      .pr-review.changes {
        color: var(--ansi-1);
      }
      .pr-review.approved {
        color: var(--ansi-2);
      }
      .pr-checks summary {
        cursor: pointer;
        color: var(--muted);
      }
      .pr-checks a {
        color: inherit;
      }
      .tests-icon.pending {
        color: var(--ansi-3);
      }
      .jira-issue > summary {
        cursor: pointer;
        list-style: none;
      }
      .jira-issue > summary::-webkit-details-marker {
        display: none;
      }
      .pr-state.jira-progress {
        color: var(--ansi-4);
        border-color: var(--ansi-4);
      }
      .pr-state.jira-done {
        color: var(--ansi-2);
        border-color: var(--ansi-2);
      }
      .jira-description {
        margin: 6px 0;
        overflow-wrap: anywhere;
      }
      .jira-description .adf-panel {
        padding: 6px 10px;
        border-left: 2px solid var(--accent);
        background: var(--surface);
      }
      .jira-description pre {
        white-space: pre-wrap;
        padding: 6px 8px;
        border: 1px solid var(--border);
      }
      .jira-description a {
        color: var(--accent);
      }
      .jira-actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 6px 0 4px;
      }
      .jira-status {
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 2px 6px;
      }
      .pr-thread {
        margin: 6px 0 10px;
        padding-left: 10px;
        border-left: 2px solid var(--border);
      }
      .pr-thread-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 4px;
      }
      .pr-thread-where {
        color: var(--muted);
        font-size: 0.9em;
      }
      .pr-comment {
        margin: 4px 0 8px;
      }
      .pr-comment-frame {
        display: block;
        width: 100%;
        height: 1.5em;
        border: none;
        background: transparent;
      }
      .pr-comment-text {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .inbox {
        border-left-color: var(--accent);
      }
      .inbox-summary {
        box-sizing: border-box;
        width: 100%;
        margin-top: 6px;
        font: inherit;
        padding: 4px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface);
        color: var(--text);
        resize: vertical;
      }
      .pr-comment-author {
        font-weight: bold;
      }
      .tests-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .tests-run {
        font: inherit;
        padding: 2px 12px;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: var(--accent-bg);
        color: var(--accent);
        cursor: pointer;
      }
      .tests-run:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .tests-status,
      .tests-counts {
        color: var(--muted);
      }
      .tests-counts {
        margin-left: 10px;
        font-size: 0.9em;
      }
      #tests-pane details > :not(summary) {
        margin-left: 18px;
      }
      #tests-pane summary {
        cursor: pointer;
      }
      .tests-section {
        margin-bottom: 10px;
      }
      .tests-runner {
        font-weight: bold;
      }
      .tests-leaf {
        margin-left: 14px;
      }
      .tests-icon {
        display: inline-block;
        width: 1.4em;
        text-align: center;
        color: var(--muted);
      }
      .tests-icon.passed {
        color: var(--ansi-2);
      }
      .tests-icon.failed {
        color: var(--ansi-1);
      }
      .tests-link {
        margin-left: 8px;
        color: var(--accent);
        cursor: pointer;
      }
      .tests-link:hover {
        text-decoration: underline;
      }
      .tests-failure {
        color: var(--muted);
        margin-top: 4px;
      }
      .tests-failure .tests-link {
        margin-left: 0;
      }
      .tests-output,
      .tests-error {
        font: inherit;
        font-size: 0.9em;
        margin: 4px 0 8px;
        padding: 8px 10px;
        border-left: 2px solid var(--border);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .tests-error {
        border-left-color: var(--ansi-1);
      }
      #nvim-pane {
        display: none;
        flex: 1 1 0;
        min-height: 0;
        flex-direction: column;
        border-top: 1px solid var(--border);
      }
      body.has-nvim #nvim-pane {
        display: flex;
      }
      #nvim-bar {
        display: flex;
        justify-content: space-between;
        padding: 4px 20px;
        color: var(--muted);
      }
      #nvim-close {
        background: none;
        border: none;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .nvim-host {
        flex: 1;
        min-height: 0;
        padding: 0 0 4px 20px;
      }
      .nvim-host[hidden] {
        display: none;
      }
      /* Only shown when the focused workspace has a file to show; otherwise
       the log takes the full width */
      #doc-pane {
        display: none;
        flex: 1 1 0;
        overflow: auto;
        padding: 10px 24px 24px;
        border-left: 1px solid var(--border);
      }
      body.has-doc #doc-pane {
        display: block;
      }
      /* A frame has the pane to itself, with no file name */
      body.has-doc.doc-frame #doc-pane {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: 0;
      }
      body.doc-frame .doc-name {
        display: none;
      }
      #doc-pane iframe {
        flex: 1;
        width: 100%;
        border: none;
      }
      #doc-pane iframe[hidden] {
        display: none;
      }
      @media (max-width: 900px) {
        main {
          flex-direction: column;
        }
        #doc-pane {
          border-left: none;
          border-top: 1px solid var(--border);
        }
      }
      .doc-name {
        color: var(--muted);
        margin-bottom: 8px;
      }
      /* The workspace's active trackers: flat like an editor's tabs, unlike
         the chips for Rex tabs */
      #trackers {
        display: flex;
        margin: -10px -24px 8px;
        border-bottom: 1px solid var(--border);
      }
      #trackers:empty {
        display: none;
      }
      body.doc-frame #trackers {
        margin: 0;
      }
      .tracker-tab.parked-toggle {
        margin-left: auto;
        border: none;
        border-left: 1px solid var(--border);
        background: none;
        font-family: inherit;
        line-height: inherit;
        font-style: italic;
      }
      body:has(#parked:popover-open) .parked-toggle {
        color: inherit;
      }
      /* The parked trackers, in a menu under the toggle (client.ts places
         it). A popover sits above the frame, which would cover it otherwise. */
      #parked:popover-open {
        display: flex;
        flex-direction: column;
      }
      #parked {
        inset: auto;
        margin: 0;
        padding: 4px 0;
        max-width: min(40ch, calc(100vw - 32px));
        max-height: 60vh;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--bg);
        color: var(--text);
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.3);
      }
      #parked button {
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 4px 14px;
        border: none;
        background: none;
        font: inherit;
        font-size: 0.9em;
        text-align: left;
        color: var(--muted);
        white-space: nowrap;
        cursor: pointer;
      }
      #parked button:hover,
      #parked button:focus-visible {
        outline: none;
        color: inherit;
        background: var(--surface);
      }
      /* Narrowed to fit, like an editor's */
      .tracker-tab {
        flex: 0 1 auto;
        min-width: 3em;
        overflow: hidden;
        text-overflow: ellipsis;
        padding: 6px 14px;
        font-size: 0.9em;
        color: var(--muted);
        white-space: nowrap;
        cursor: pointer;
        border-right: 1px solid var(--border);
      }
      .tracker-tab:hover {
        color: inherit;
      }
      .tracker-tab.current {
        color: var(--accent);
        background: var(--accent-bg);
      }
      .markdown-body {
        background: transparent;
        font-size: 16px;
      }
      .markdown-body > :first-child {
        margin-top: 0;
      }
      ah-markdown {
        --ah-markdown-flash: var(--accent-bg);
      }
      /* Graph lines fill the whole line height (see box.ts), so this can be roomy */
      pre.log {
        margin: 0;
        font: inherit;
        line-height: 1.35;
      }
      /* Files and change IDs that open on a click (client.ts) */
      pre.log a[data-file],
      pre.log a[data-rev] {
        cursor: pointer;
      }
      pre.log a[data-file]:hover,
      pre.log a[data-rev]:hover {
        text-decoration: underline;
      }
      .empty {
        color: var(--muted);
        padding: 20px;
      }
      /* The open-with menu, at the pointer (client.ts) */
      #open-menu {
        inset: auto;
        margin: 0;
        padding: 4px 0;
        min-width: 200px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--bg);
        color: var(--text);
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.3);
      }
      .open-menu-file {
        padding: 2px 14px 4px;
        color: var(--muted);
        font-size: 0.85em;
        border-bottom: 1px solid var(--border);
        margin-bottom: 2px;
      }
      #open-menu button {
        display: block;
        width: 100%;
        padding: 4px 14px;
        border: none;
        background: none;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      #open-menu button:hover {
        background: var(--surface);
        color: var(--accent);
      }
      /* How a jj operation went, with Undo or jj's message (client.ts) */
      #op-toast {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 8;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        max-width: min(72ch, calc(100vw - 32px));
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--bg);
        color: var(--text);
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.3);
      }
      #op-toast[hidden] {
        display: none;
      }
      #op-toast.error {
        border-left: 3px solid var(--ansi-1);
      }
      .op-toast-text {
        flex: 1;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 40vh;
        overflow-y: auto;
      }
      #op-toast button {
        flex: none;
        padding: 0 8px;
        font: inherit;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      #op-toast button:hover {
        color: var(--accent);
        border-color: var(--accent);
      }
      #new-tracker {
        flex: none;
        padding: 2px 9px;
        font: inherit;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      #new-tracker:hover,
      body:has(#new-tracker-form:popover-open) #new-tracker {
        color: var(--accent);
        border-color: var(--accent);
      }
      #new-tracker:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* Under the button, placed by client.ts as #parked is */
      #new-tracker-form {
        inset: auto;
        margin: 0;
        width: min(48ch, calc(100vw - 32px));
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--bg);
        color: var(--text);
        box-shadow: 0 4px 12px rgb(0 0 0 / 0.3);
      }
      #new-tracker-for {
        color: var(--muted);
        font-size: 0.9em;
        margin-bottom: 6px;
      }
      #new-tracker-goal {
        display: block;
        box-sizing: border-box;
        width: 100%;
        resize: vertical;
        font: inherit;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--surface);
        color: var(--text);
      }
      .new-tracker-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        margin-top: 6px;
      }
      #new-tracker-note {
        color: var(--muted);
        font-size: 0.9em;
      }
      #new-tracker-send {
        font: inherit;
        padding: 2px 12px;
        border-radius: 5px;
        border: 1px solid var(--border);
        background: var(--accent-bg);
        color: var(--accent);
        cursor: pointer;
      }
      #new-tracker-send:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
      }
      #status.live {
        background: #3fb950;
      }
      #status.trouble {
        background: #d29922;
      }
    </style>
  </head>
  <body>
    <div id="top">
      <nav id="strip"></nav>
      <button id="new-tracker" popovertarget="new-tracker-form">Add tracker</button>
      <div id="status" title="disconnected"></div>
    </div>
    <main>
      <div id="left">
        <nav id="log-tabs">
          <span class="log-tab current" data-tab="jj">jj</span>
          <span class="log-tab" data-tab="tests">Tests <span id="tests-badge"></span></span>
          <span class="log-tab" data-tab="prs">PRs <span id="prs-badge"></span></span>
          <span class="log-tab" data-tab="issues"
            >Issues <span id="issues-badge"></span
          ></span>
          <span id="log-actions">
            <button id="op-new" title="jj new: a new change on top of the working copy">
              New
            </button>
          </span>
        </nav>
        <div id="log-pane">
          <p class="empty">Waiting for Rex…</p>
        </div>
        <div id="tests-pane" hidden></div>
        <div id="prs-pane" hidden></div>
        <div id="issues-pane" hidden></div>
        <div id="nvim-pane">
          <div id="nvim-bar">
            <span id="nvim-name"></span>
            <button id="nvim-close" title="Close nvim (or :q)">✕</button>
          </div>
        </div>
      </div>
      <div id="doc-pane">
        <nav id="trackers"></nav>
        <div id="parked" popover></div>
        <div class="doc-name" id="doc-name"></div>
      </div>
    </main>
    <div id="open-menu" popover="manual"></div>
    <div id="op-toast" role="status" hidden></div>
    <div id="new-tracker-form" popover>
      <div id="new-tracker-for"></div>
      <textarea
        id="new-tracker-goal"
        rows="4"
        placeholder="What's the goal? The tab's agent makes the tracker."
      ></textarea>
      <div class="new-tracker-row">
        <span id="new-tracker-note">⌘↵ sends</span>
        <button id="new-tracker-send">Send</button>
      </div>
    </div>
    <script type="module" src="../markdown/preview.js"></script>
    <script type="module" src="client.js"></script>
  </body>
</html>
